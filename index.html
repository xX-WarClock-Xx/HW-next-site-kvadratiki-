<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый Bento макет</title>
    <!-- Подключаем внешний файл со стилями -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный контейнер для всего сайта -->
    <div class="main-container">

        <!-- ЛЕВАЯ КОЛОНКА -->
        <div class="column side-column">
            <div class="card card-tall"></div>
            <div class="card card-square"></div>
            <div class="card card-wide-bottom"></div>
        </div>

        <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА -->
        <div class="column center-column">
            <!-- Верхний ряд в центре состоит из двух маленьких карточек -->
            <div class="center-top-row">
                <div class="card card-small"></div>
                <div class="card card-small"></div>
            </div>
            <!-- Огромная карточка по центру -->
            <div class="card card-main"></div>
            <!-- Нижняя карточка в центре -->
            <div class="card card-square-bottom"></div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА -->
        <div class="column side-column">
            <div class="card card-tall"></div>
            <div class="card card-tall-bottom"></div>
        </div>

    </div>

</body>
</html>
